<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Huella de carbono</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f9f4;
            color: #333;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: #2c786c;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border-top: 4px solid #2c786c;
            width: 100%;
        }

        .hidden {
            display: none;
        }

        h2 {
            margin-bottom: 15px;
            color: #2c786c;
            font-size: 1.4rem;
        }

        .user-controls, .form-group, .user-list {
            margin-bottom: 15px;
            width: 100%;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            background-color: #2c786c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #1b5048;
        }

        button:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .stat-box h3 {
            font-size: 1rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-box p {
            font-size: 28px;
            font-weight: bold;
            color: #2c786c;
        }

        .log-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
            background-color: #fafafa;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        /* Responsive para computadora */
        @media (min-width: 600px) {
            body { padding: 30px; }
            .card { padding: 30px; }
            .user-controls {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            input, select {
                margin-bottom: 0;
                max-width: 350px;
            }
            button { width: auto; }
            .btn-submit { max-width: 350px; }
            .stats { flex-direction: row; }
            .stat-box { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌿 EcoTrack</h1>
            <p>Monitorea tu huella de carbono</p>
        </header>

        <!-- Sección de usuarios -->
        <section class="card" id="user-section">
            <h2>👥 Perfiles</h2>
            <div class="user-controls">
                <input type="text" id="new-username" placeholder="Ingresa un nombre">
                <button onclick="createUser()">Crear perfil</button>
            </div>
            <div class="user-list">
                <label for="user-select">Usuario actual:</label>
                <select id="user-select" onchange="switchUser()">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>
        </section>

        <!-- Sección de registro -->
        <section class="card hidden" id="tracker-section">
            <h2 id="greeting">Registro diario</h2>
            <form id="eco-form" onsubmit="addRecord(event)">
                <div class="form-group">
                    <label>🥩 Carne de res o cerdo (porciones):</label>
                    <input type="number" id="meat" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label>🍗 Pollo o pescado (porciones):</label>
                    <input type="number" id="chicken" value="0" min="0" required>
                </div>
                <div class="form-group">
                    <label>🥗 Vegetales o granos (porciones):</label>
                    <input type="number" id="veggie" value="0" min="0" required>
                </div>
                <button type="submit" class="btn-submit">Guardar registro</button>
            </form>
        </section>

        <!-- Sección de análisis -->
        <section class="card hidden" id="analysis-section">
            <h2>📊 Análisis de impacto</h2>
            <div class="stats">
                <div class="stat-box">
                    <h3>Total de CO2</h3>
                    <p id="total-co2">0 kg</p>
                </div>
                <div class="stat-box">
                    <h3>Árboles necesarios</h3>
                    <p id="trees-needed">0</p>
                </div>
            </div>
            <div id="history-log">
                <!-- El historial aparece aquí -->
            </div>
        </section>
    </div>

    <script>
        const CO2_FACTORS = {
            meat: 3.5,
            chicken: 1.2,
            veggie: 0.4
        };

        let users = JSON.parse(localStorage.getItem('ecoUsers')) || {};
        let currentUser = null;

        window.onload = () => {
            updateUserSelect();
        };

        function createUser() {
            const input = document.getElementById('new-username');
            const name = input.value.trim();
            
            if (name === '') return alert('Por favor, ingresa un nombre.');
            if (users[name]) return alert('Este perfil ya existe.');

            users[name] = { totalCO2: 0, history: [] };
            saveData();
            updateUserSelect();
            
            document.getElementById('user-select').value = name;
            switchUser();
            input.value = '';
        }

        function updateUserSelect() {
            const select = document.getElementById('user-select');
            select.innerHTML = '<option value="">-- Seleccionar --</option>';
            
            for (let name in users) {
                select.innerHTML += `<option value="${name}">${name}</option>`;
            }
        }

        function switchUser() {
            const select = document.getElementById('user-select');
            currentUser = select.value;

            const trackerSec = document.getElementById('tracker-section');
            const analysisSec = document.getElementById('analysis-section');

            if (currentUser) {
                document.getElementById('greeting').innerText = `Registro diario de ${currentUser}`;
                trackerSec.classList.remove('hidden');
                analysisSec.classList.remove('hidden');
                updateDashboard();
            } else {
                trackerSec.classList.add('hidden');
                analysisSec.classList.add('hidden');
            }
        }

        function addRecord(event) {
            event.preventDefault();

            const meat = parseFloat(document.getElementById('meat').value);
            const chicken = parseFloat(document.getElementById('chicken').value);
            const veggie = parseFloat(document.getElementById('veggie').value);

            const dailyCO2 = (meat * CO2_FACTORS.meat) + (chicken * CO2_FACTORS.chicken) + (veggie * CO2_FACTORS.veggie);

            const today = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            users[currentUser].history.push({ 
                date: today, 
                co2: dailyCO2.toFixed(2), 
                details: `Carne: ${meat} | Pollo: ${chicken} | Vegetales: ${veggie}` 
            });
            users[currentUser].totalCO2 += dailyCO2;

            saveData();
            updateDashboard();
            
            document.getElementById('eco-form').reset();
        }

        function updateDashboard() {
            const userData = users[currentUser];
            
            document.getElementById('total-co2').innerText = `${userData.totalCO2.toFixed(2)} kg`;
            
            const trees = (userData.totalCO2 / 22).toFixed(1);
            document.getElementById('trees-needed').innerText = trees;

            const historyDiv = document.getElementById('history-log');
            historyDiv.innerHTML = '<h3>Historial</h3><br>';
            
            userData.history.slice().reverse().forEach(record => {
                historyDiv.innerHTML += `
                    <div class="log-item">
                        <strong>${record.date}</strong> - Generó: <span style="color:#e74c3c; font-weight:bold;">${record.co2} kg CO2</span> <br>
                        <small style="color:#666;">${record.details}</small>
                    </div>
                `;
            });
        }

        function saveData() {
            localStorage.setItem('ecoUsers', JSON.stringify(users));
        }
    </script>
</body>
</html>
